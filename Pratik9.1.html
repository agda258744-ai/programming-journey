<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Block dan Iniline</title>
    <style>
        .block {
            display: block;
            background-color: lightblue;
            margin: 5px;
        }
        .inline {
            display: inline;
            background-color: lightgreen;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>Contoh Block</h1>
    <div class="block">Box 1</div>
    <div class="block">Box 2</div>

    <h1>Contoh Inline</h1>
    <span class="inline">Box 3</span>
    <span class="inline">Box 4</span>
</body>
</html>
