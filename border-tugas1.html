<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktik border 1</title>
    <style> 
     .solid {
        border: 5px solid lightblue;
        padding: 10px;
        background-color: lightgoldenrodyellow;
     }
     .dotted {
        border: 3px dotted red;
        padding: 10px;
        background-color: lightsalmon;
     }
     .double {
        border: 5px double green;
        padding: 10px;
        background-color: lightgreen;
     }
     .dashed {
        border: 3px dashed hotpink;
        padding: 10px;
        background-color: pink;
     }
     .groove {
        border: 5px groove skyblue;
        padding: 10px;
        background-color: khaki;
     }
     .ridge{
        border: 5px ridge orange;
        padding: 10px;
        background-color: lightskyblue;
     }
    </style>
</head>
<body>
    <h1>Border CSS</h1>

    <p class="solid">Ini border Solid</p>
    <p class="dotted">Ini border Dotted</p>
    <p class="double">Ini border Double</p>
    <p class="dashed">Ini border Dashed</p>
    <p class="groove">Ini border Groove</p>
    <p class="ridge">Ini border Ridge</p>
</body>
</html>
