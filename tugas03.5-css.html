    <title>Text Shadow</title>
    <style>
        h1 {
            color: skyblue;
            text-shadow: 1px 3px 2px rgba(211, 123, 152, 0.8);

    <h1>Ini adalah Contoh Text Shadow</h1>
</body>
</html>
